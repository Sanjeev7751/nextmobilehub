<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextMobileHub</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{
background:#0d6efd;
color:white;
text-align:center;
padding:25px;
}

nav{
background:#222;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search-box{
text-align:center;
margin-bottom:25px;
}

.search-box input{
width:80%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

.phone-grid{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.phone-card{
background:white;
width:300px;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.phone-card img{
width:200px;
height:250px;
object-fit:cover;
border-radius:10px;
}

.btn{
display:inline-block;
background:#0d6efd;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:5px;
margin-top:10px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}

</style>
</head>

<body>

<header>
<h1>📱 NextMobileHub</h1>
<p>Latest Smartphones, Prices & Launch Dates</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Samsung</a>
<a href="#">OnePlus</a>
<a href="#">Apple</a>
<a href="#">News</a>
</nav>

<div class="container">

<div class="search-box">
<input type="text" placeholder="Search Smartphone...">
</div>

<div class="phone-grid">

<div class="phone-card">
<img src="https://via.placeholder.com/200x250?text=Samsung+S26+Ultra">

<h2>Samsung Galaxy S26 Ultra</h2>

<p>Expected Price: ₹1,25,999</p>

<a href="samsung-s26-ultra.html" class="btn">
View Details
</a>

</div>

<div class="phone-card">
<img src="https://via.placeholder.com/200x250?text=OnePlus+16">

<h2>OnePlus 16</h2>

<p>Launch Date: 31 October 2026</p>

<a href="oneplus-16.html" class="btn">
View Details
</a>

</div>

<div class="phone-card">
<img src="https://via.placeholder.com/200x250?text=iPhone+18+Pro+Max">

<h2>iPhone 18 Pro Max</h2>

<p>Expected Price: ₹1,49,999</p>

<a href="iphone-18-pro-max.html" class="btn">
View Details
</a>

</div>

</div>

</div>

<footer>
© 2026 NextMobileHub
</footer>

</body>
</html>
